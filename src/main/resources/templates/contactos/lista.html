<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Contactos - Address Book')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Contactos</h1>
        <a th:href="@{/contactos/nuevo}" class="btn btn-success">+ Nuevo contacto</a>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table id="tablaContactos" class="table table-striped table-hover w-100">
                <thead>
                <tr>
                    <th>Avatar</th>
                    <th>Código</th>
                    <th>Nombres</th>
                    <th>Teléfono</th>
                    <th>Email</th>
                    <th>Cumpleaños</th>
                    <th>Acciones</th>
                </tr>
                </thead>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:inline="javascript">
    const dataUrl = /*[[@{/contactos/data}]]*/ '/contactos/data';
    const editBase = /*[[@{/contactos/}]]*/ '/contactos/';
    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfParam = document.querySelector('meta[name="_csrf_param"]').content;

    function eliminarContacto(id, nombre) {
        if (!confirm('¿Eliminar a ' + nombre + '?')) return;
        const form = document.createElement('form');
        form.method = 'post';
        form.action = editBase + id + '/eliminar';
        const token = document.createElement('input');
        token.type = 'hidden';
        token.name = csrfParam;
        token.value = csrfToken;
        form.appendChild(token);
        document.body.appendChild(form);
        form.submit();
    }

    $(function () {
        $('#tablaContactos').DataTable({
            serverSide: true,
            processing: true,
            ajax: { url: dataUrl },
            order: [ [2, 'asc'] ],
            pageLength: 25,
            lengthMenu: [10, 25, 50, 100],
            language: {
                processing: 'Procesando...',
                search: 'Buscar:',
                lengthMenu: 'Mostrar _MENU_ registros',
                info: 'Mostrando _START_ a _END_ de _TOTAL_ contactos',
                infoEmpty: 'Sin contactos',
                infoFiltered: '(filtrado de _MAX_ en total)',
                zeroRecords: 'No se encontraron contactos',
                emptyTable: 'No hay contactos disponibles',
                paginate: { first: 'Primero', previous: 'Anterior', next: 'Siguiente', last: 'Último' }
            },
            columns: [
                {
                    data: 'id', orderable: false, searchable: false,
                    render: function (id) {
                        return '<img src="' + editBase + id + '/avatar" alt="avatar" ' +
                            'class="avatar-thumb rounded-circle">';
                    }
                },
                { data: 'codigo' },
                { data: 'nombres' },
                { data: 'telefono' },
                { data: 'email' },
                { data: 'cumpleanos' },
                {
                    data: 'id', orderable: false, searchable: false,
                    render: function (id, type, row) {
                        const nombre = (row.nombres || '').replace(/'/g, "\\'");
                        return '<a href="' + editBase + id + '/editar" class="btn btn-sm btn-primary">Editar</a> ' +
                            '<button type="button" class="btn btn-sm btn-danger" ' +
                            'onclick="eliminarContacto(' + id + ', \'' + nombre + '\')">Eliminar</button>';
                    }
                }
            ]
        });
    });
</script>
</body>
</html>
