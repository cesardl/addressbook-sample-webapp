<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Address Book</title>
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
    <meta name="_csrf_param" th:content="${_csrf != null} ? ${_csrf.parameterName} : '_csrf'">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/datatables/1.13.5/css/jquery.dataTables.min.css}">
    <link rel="stylesheet" th:href="@{/css/addressbook.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/contactos}">📇 Address Book</a>
        <div class="d-flex align-items-center gap-3">
            <span class="navbar-text text-light" sec:authorize="isAuthenticated()">
                <span sec:authentication="name">usuario</span>
                <span class="badge bg-secondary" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                <span class="badge bg-info text-dark" sec:authorize="hasRole('USER')">USER</span>
            </span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-outline-light btn-sm" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="scripts">
    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/datatables/1.13.5/js/jquery.dataTables.min.js}"></script>
</div>

</body>
</html>
